# CI pipeline — P1 fix item 6
# Runs on every push and pull_request targeting main.
# Gate: ruff lint + pytest -x (fail-fast).  No merge without green CI.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: pytest
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # PySide6 wheels dlopen Qt's shared libraries (libEGL, libGL, ...),
      # which a bare ubuntu runner does not ship. Without them every test
      # importing npsc_gui fails at import time (libEGL.so.1: cannot open).
      - name: Install Qt runtime libraries (headless)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libxkbcommon0 libdbus-1-3 libfontconfig1 libglib2.0-0

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install pytest pytest-cov ruff

      - name: Lint (ruff — errors + warnings, ignore line-length)
        run: ruff check src/ tests/ --select E,F,W --ignore E501

      - name: Run tests (fail-fast, short tracebacks, coverage)
        run: |
          python -m pytest tests/ -x --tb=short -q \
            --cov=src --cov-report=term-missing
        env:
          PYTHONPATH: src
          # Headless runner: no display server, use Qt's offscreen plugin.
          QT_QPA_PLATFORM: offscreen
