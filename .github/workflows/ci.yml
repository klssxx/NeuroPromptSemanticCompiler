name: CI — tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # Install package in editable mode; PySide6 is the only runtime dep
          # Use --no-deps for CI to avoid heavy Qt download; tests that require
          # PySide6 are skipped automatically when it is absent.
          pip install -e ".[dev]" --no-deps 2>/dev/null || pip install -e . --no-deps
          pip install pytest

      - name: Run tests
        run: pytest --tb=short -q
        env:
          PYTHONPATH: src
